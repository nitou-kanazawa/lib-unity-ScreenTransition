# パッケージのテスト実行 (EditMode / PlayMode)
# PR と develop への push で自動実行される。
#
# game-ci/unity-test-runner は Unity ライセンスを要求するため、下記いずれかの場合は
# guard ジョブが test ジョブごとスキップさせる (未設定のリポジトリや fork を赤くしないため)。
#   - Repository secret UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD が未設定
#   - fork からの PR (Secret が渡らない)
name: Test

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch: {}

# 同一ブランチへの連続 push では古い実行を打ち切る (Unity ライセンスの同時利用数を節約する)
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret の有無を判定する。
  # Secret は if: 条件から直接参照できないため、ジョブ env に展開してから判定する。
  guard:
    name: Check credentials
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::UNITY_LICENSE が未設定のためテストをスキップします"
          fi

  test:
    name: EditMode / PlayMode
    runs-on: ubuntu-latest
    needs: guard
    # fork からの PR には Secret が渡らないため併せて除外する
    if: >-
      needs.guard.outputs.enabled == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      # リポジトリのチェックアウト
      - name: Check out my unity project.
        uses: actions/checkout@v4

      # NuGetForUnity で管理している NuGetパッケージを復元する。
      # InstalledPackages は .gitignore 対象でリポジトリに含まれないため、
      # CI 上で明示的に復元しないとコンパイルに失敗する。
      - name: Restore NuGetForUnity packages
        run: |
          dotnet tool install --global NuGetForUnity.Cli
          export PATH="$PATH:$HOME/.dotnet/tools"
          nugetforunity restore unity

      # Library キャッシュ。ビルド用ワークフローとはキーを分ける
      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-Test-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: |
            Library-Test-

      # EditMode / PlayMode の両方を実行する (testMode: all)
      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          # Unityプロジェクトのルートは unity/ サブディレクトリ
          projectPath: unity
          testMode: all
          # unity/ProjectSettings/ProjectVersion.txt の m_EditorVersion を自動で参照する
          unityVersion: auto
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Test results

      # NUnit の XML レポートを保存する (失敗時も残す)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
